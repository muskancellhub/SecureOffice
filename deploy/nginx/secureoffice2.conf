server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name secureaioffice.com www.secureaioffice.com 209.35.98.135 _;

    root /home/usr004199/app/frontend/dist;
    index index.html;
    client_max_body_size 25m;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/ssl/cloudflare/secureaioffice.pem;
    ssl_certificate_key /etc/ssl/cloudflare/secureaioffice.key;
    # API -> FastAPI on localhost (trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        try_files $uri $uri/ /index.html;
                add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.squarecdn.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.squarecdn.com; font-src 'self' https://fonts.gstatic.com https://*.squarecdn.com https://d1g145x70srn7h.cloudfront.net; img-src 'self' data: blob: https://*.squarecdn.com; connect-src 'self' https://esm.sh https://*.squarecdn.com https://pci-connect.squareupsandbox.com https://pci-connect.squareup.com https://*.anam.ai wss://*.anam.ai; frame-src 'self' https://embed.diagrams.net https://*.squarecdn.com; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;
    }
}
