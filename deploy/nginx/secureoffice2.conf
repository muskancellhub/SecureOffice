server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name secureaioffice.com www.secureaioffice.com 209.35.98.135 _;

    root /home/usr004199/app/frontend/dist;
    index index.html;
    client_max_body_size 25m;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/ssl/cloudflare/secureaioffice.pem;
    ssl_certificate_key /etc/ssl/cloudflare/secureaioffice.key;
    # API -> FastAPI on localhost (trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
