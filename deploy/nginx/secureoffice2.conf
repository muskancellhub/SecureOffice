# SecureOffice2 — the single public entrypoint.
#
# Install: /etc/nginx/conf.d/secureoffice2.conf   (see deploy/README.md)
#
# EDIT BEFORE USE: the two `root` / ExecStart paths marked "EDIT ME" must point
# at this checkout on the server. Nothing else here is host-specific.
#
# Why this exists: the frontend and API used to be two origins (:5173 and
# :8000), which forced CORS, cross-origin cookies, and a hostname baked into
# the JS bundle at build time. This block collapses them onto one origin, so
# the built bundle carries no hostname at all (frontend/src/api/config.ts) and
# the same artifact runs here, on localhost, and behind a domain later.
#
# TLS later: copy this block to `listen 443 ssl`, add the cert directives, and
# reduce this one to `return 301 https://$host$request_uri;`. No application
# change is needed — but see "HTTP-only caveats" in deploy/README.md for what
# stays broken until that happens.

server {
    listen      80;
    listen      [::]:80;
    server_name 209.35.98.135 _;

    # EDIT ME — directory containing the output of `npm run build`.
    root  /srv/secureoffice2/frontend/dist;
    index index.html;

    access_log /var/log/nginx/secureoffice2.access.log;
    error_log  /var/log/nginx/secureoffice2.error.log;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────────
    # The TRAILING SLASH on proxy_pass is load-bearing: it strips the /api
    # prefix, because FastAPI's routers are mounted at bare /auth, /orders, …
    # Uvicorn runs with `--root-path /api` so the app still *generates*
    # /api-prefixed URLs (verified: openapi.json reports servers [{url:/api}]).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Five services call an LLM (AI design generation, chatbot, intake
        # parsing, CDW agent, embeddings). Those routinely outrun nginx's 60s
        # default, which would surface to the user as a bare 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Grafana (optional — leave commented unless monitoring runs HERE) ───
    # Grafana is not transparently sub-path-able. Uncommenting this block alone
    # yields a blank iframe; it also needs, in monitoring/docker-compose.yml:
    #
    #   GF_SERVER_ROOT_URL: http://209.35.98.135/grafana/
    #   GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    #   ports: ["127.0.0.1:3000:3000"]   # keep 3000 off the public interface
    #
    # …and VITE_GRAFANA_URL=/grafana set at build time. Binding to loopback
    # matters: the stack ships anonymous Viewer access with X-Frame-Options
    # stripped, so a publicly-bound :3000 exposes the dashboards to anyone.
    #
    # location /grafana/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Upgrade           $http_upgrade;   # Grafana Live
    #     proxy_set_header Connection        "upgrade";
    # }

    # ── Fingerprinted assets ──────────────────────────────────────────────
    # Vite hashes these filenames, so they can never go stale — cache hard.
    # One directive, not `expires` + `add_header` — those emit two competing
    # Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA ───────────────────────────────────────────────────────────────
    # react-router runs in history mode: a hard refresh on /shop/vendor must
    # serve index.html rather than 404. index.html itself must NOT be cached —
    # a cached copy keeps requesting the previous deploy's hashed asset names,
    # which 404 after the next build.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
