# SecureOffice2 log routing (docs/LOGGING_PLAN.md §3, §5).
#
# Install on the server (not used in dev — macOS has no rsyslog):
#   sudo install -d -o syslog -g adm -m 0750 /var/log/secureoffice
#   sudo cp deploy/rsyslog.d/secureoffice.conf /etc/rsyslog.d/30-secureoffice.conf
#   sudo systemctl restart rsyslog
# App side: LOG_SINK=syslog (the app then writes to /dev/log, never to files).

# Default max message size is 8k, which truncates server_error lines carrying
# stack traces (plan §8). Must appear before any input module directives.
$MaxMessageSize 64k

# Never drop audit events: rsyslog's burst rate limiting silently discards
# messages under load (plan §8).
$SystemLogRateLimitInterval 0
$SystemLogRateLimitBurst 0

# New files: 0640, syslog:adm (plan §5.1) — the app has no write access here.
$FileCreateMode 0640
$FileOwner syslog
$FileGroup adm

# local0 = application logs, local1 = audit events (plan §2.3).
# "& stop" keeps these out of the catch-all /var/log/syslog.
local0.*    /var/log/secureoffice/app.log
& stop
local1.*    /var/log/secureoffice/audit.log
& stop
